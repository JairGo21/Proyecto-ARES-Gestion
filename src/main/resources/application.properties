spring.application.name=ares

# Base de datos H2 embebida en archivo: se crea sola en ./data/ al primer arranque.
# No hay que instalar servidores ni configurar variables de entorno.
spring.datasource.url=jdbc:h2:file:./data/ares
spring.datasource.username=sa
spring.datasource.password=

# El esquema lo crea Flyway con los archivos versionados de src/main/resources/db/migration.
# Hibernate NO crea ni modifica tablas.
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=none

# Vistas Thymeleaf sin caché para ver los cambios del HTML sin reiniciar.
spring.thymeleaf.cache=false

server.port=8080
