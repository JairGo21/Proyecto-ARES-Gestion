<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Salida - ARES</title>
    <link rel="stylesheet" th:href="@{/css/ares.css}">
</head>
<body>
<div th:replace="~{fragmentos :: cabecera}"></div>

<main class="contenedor">
    <h2>Registrar Salida de Inventario</h2>

    <div th:if="${error}" class="alerta error" th:text="${error}"></div>

    <form th:action="@{/salidas}" method="post" class="formulario">
        <div class="campo">
            <label for="productoId">Producto:</label>
            <select id="productoId" name="productoId" required>
                <option value="">-- Seleccione un producto --</option>
                <option th:each="p : ${productos}"
                        th:value="${p.id}"
                        th:text="${p.nombre + ' (Stock: ' + p.stockActual + ')'}"
                        th:selected="${p.id == productoSeleccionadoId}">
                </option>
            </select>
        </div>

        <div class="campo">
            <label for="cantidad">Cantidad:</label>
            <input type="number" id="cantidad" name="cantidad" min="1" required>
        </div>

        <div class="campo">
            <label for="tipo">Tipo de Salida:</label>
            <select id="tipo" name="tipo" required>
                <option th:each="t : ${tiposMovimiento}"
                        th:value="${t}"
                        th:text="${t}">
                </option>
            </select>
        </div>

        <div class="campo">
            <label for="motivo">Motivo (obligatorio para Baja por otro motivo):</label>
            <input type="text" id="motivo" name="motivo" placeholder="Ej. Botella rota, muestra comercial">
        </div>

        <div class="acciones">
            <button type="submit" class="boton primario">Guardar Salida</button>
            <a th:href="@{/productos}" class="boton secundario">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
